name: Job alerts pipeline
# Run title carries the run type; the backup guard matches successful runs by it.
run-name: >-
  ${{ github.event_name == 'schedule' && 'backup ' || '' }}${{ github.event_name == 'schedule'
  && ((github.event.schedule == '15 15 * * *' || github.event.schedule == '15 13 * * *') && 'evening' || 'morning')
  || inputs.run || 'morning' }}${{ inputs.sources && ' (test)' || '' }}

# Public repo hygiene: no artifacts; logs/summaries show counts and errors only.
# Scraped data is pushed to the private data repo (DATA_REPO_TOKEN: fine-grained,
# contents read/write on Keshav242002/job-alerts-data only).
# Primary trigger: cron-job.org calls workflow_dispatch (run=morning at 08:45 IST, run=evening at 18:45 IST).
# GitHub crons are only a backup, 2 hours later; they skip when that run type already succeeded.
on:
  schedule:
    - cron: "15 5 * * *"   # 10:45 IST — backup morning: LinkedIn, Wellfound (+ best-effort Naukri, ATS, freehire)
    - cron: "15 15 * * *"  # 20:45 IST — backup evening: LinkedIn, Wellfound (+ best-effort ATS, freehire)
  workflow_dispatch:
    inputs:
      run:
        description: "Which run: decides the sources (see SCHEDULE.md)"
        type: choice
        options: [morning, evening]
        default: morning
      wellfound_mode:
        description: "Wellfound mode"
        type: choice
        options: [auto, incremental, full]
        default: auto
      sources:
        description: "Optional: comma-separated sources to run instead of the run's default (testing)"
        type: string
        default: ""

permissions:
  contents: write  # runs/latest.md keep-alive + companies.json commits to this repo
  actions: read    # backup guard: list this workflow's recent runs

concurrency:
  group: job-alerts-pipeline
  cancel-in-progress: false

env:
  # dispatch: the "run" input decides; backup crons: 15:15 UTC = evening, 05:15 UTC = morning
  # (15 13 kept so a late event from the old evening cron can never become a Naukri morning run)
  RUN_NAME: ${{ github.event_name == 'schedule' && ((github.event.schedule == '15 15 * * *' || github.event.schedule == '15 13 * * *') && 'evening' || 'morning') || inputs.run || 'morning' }}
  WELLFOUND_MODE: ${{ inputs.wellfound_mode || 'auto' }}
  SOURCES: ${{ inputs.sources || '' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Backup guard (skip if this run type already succeeded in the last 6h)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/pipeline.yml/runs?status=success&per_page=50" \
                -q "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.updated_at >= \"$since\")
                     | select(.display_title == \"$RUN_NAME\" or .display_title == \"backup $RUN_NAME\")] | length")
          if [ "${n:-0}" -gt 0 ]; then
            echo "A successful $RUN_NAME run finished since $since — backup skipped."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "No successful $RUN_NAME run since $since — running the backup."
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - name: Check DATA_REPO_TOKEN
        if: env.SKIP != '1'
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        # run outside the workspace: actions/checkout saved GITHUB_TOKEN as an auth header in the
        # repo's git config, which would override the token in the URL
        working-directory: ${{ runner.temp }}
        run: |
          if [ -z "$TOKEN" ] || ! git ls-remote "https://x-access-token:${TOKEN}@github.com/Keshav242002/job-alerts-data.git" HEAD >/dev/null 2>&1; then
            echo "::error title=Data repo access failed::DATA_REPO_TOKEN expired or invalid"
            exit 1
          fi
          # expiry date of the fine-grained token (from GitHub's response header; not secret)
          exp=$(curl -sI -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/Keshav242002/job-alerts-data \
                | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          if [ -n "$exp" ]; then
            days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
            echo "DATA_REPO_TOKEN expires: $exp ($days days left)"
            if [ "$days" -lt 14 ]; then
              echo "::warning title=DATA_REPO_TOKEN expiring::expires in $days days ($exp) — create a new token and update the secret"
            fi
          else
            echo "DATA_REPO_TOKEN expiry: none reported (no expiry set)"
          fi

      - name: Check out private data repo
        if: env.SKIP != '1'
        uses: actions/checkout@v4
        with:
          repository: Keshav242002/job-alerts-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Create venvs
        if: env.SKIP != '1'
        working-directory: job-scraper-test
        run: |
          python -m venv venv-jobspy && venv-jobspy/bin/pip install -q -r requirements-jobspy.txt
          python -m venv venv-jobdrop && venv-jobdrop/bin/pip install -q -r requirements-jobdrop.txt

      - name: Run pipeline
        if: env.SKIP != '1'
        working-directory: job-scraper-test
        run: |
          set +e
          venv-jobspy/bin/python pipeline.py --run "$RUN_NAME" --wellfound-mode "$WELLFOUND_MODE" \
            ${SOURCES:+--sources "$SOURCES"} --data-dir ../data --public-dir ..
          echo "PIPELINE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Push data (private repo)
        if: env.SKIP != '1'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A seen_jobs.csv new_jobs.csv new_jobs_log.csv excluded.csv excluded_log.csv run_history.csv last_run_queries.csv state
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -q -m "$RUN_NAME run $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push -q; then
            echo "::error title=Data push failed::DATA_REPO_TOKEN expired or invalid"
            exit 1
          fi

      - name: Push runs/latest.md (public keep-alive)
        if: always() && env.SKIP != '1'
        run: |
          [ -f runs/latest.md ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/latest.md job-scraper-test/companies.json
          if git diff --cached --quiet; then echo "no summary changes"; exit 0; fi
          git commit -q -m "runs: $RUN_NAME $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q

      - name: Fail if any source failed
        if: env.SKIP != '1' && env.PIPELINE_EXIT != '0'
        working-directory: job-scraper-test
        run: |
          failed=$(cat work/failed_sources.txt 2>/dev/null)
          echo "::error title=Sources failed::Pipeline exit ${PIPELINE_EXIT}; failed sources: ${failed:-unknown (see Run pipeline step)}"
          exit 1
